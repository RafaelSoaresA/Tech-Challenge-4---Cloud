name: CI/CD

on:
  pull_request:
    branches: [main]      # PR: só compila e testa (não toca na AWS)
  push:
    branches: [main]      # merge na main: testa + deploy + smoke test
  workflow_dispatch: {}

permissions:
  id-token: write         # necessário para login na AWS via OIDC (sem chaves fixas)
  contents: read

env:
  AWS_REGION: us-east-1
  STACK_NAME: feedback-aulas-dev

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Lambdas - compilar e testar (gera target/function.zip)
        run: mvn -B verify
      - name: API de avaliação (Spring Boot) - compilar e testar
        run: mvn -B -f avaliacao-api/pom.xml verify
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar template (cfn-lint)
        run: pip install cfn-lint && cfn-lint template.yaml

  deploy:
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-dev   # evita dois deploys ao mesmo tempo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Login na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Empacotar as Lambdas (testes já rodaram no job anterior)
        run: mvn -B package -DskipTests

      # ---- API Spring no Beanstalk: gera o pacote (jar + Procfile) e envia para o S3 ----
      - name: Empacotar a avaliacao-api
        run: |
          mvn -B -f avaliacao-api/pom.xml package -DskipTests
          mkdir -p eb-bundle
          cp avaliacao-api/target/avaliacao-api-*.jar eb-bundle/app.jar   # (.jar.original não casa com o padrão)
          echo 'web: java -XX:MaxRAMPercentage=70 -jar app.jar' > eb-bundle/Procfile
          (cd eb-bundle && zip -qr ../avaliacao-api-bundle.zip .)

      - name: Enviar pacote ao S3 e descobrir a plataforma do Beanstalk
        run: |
          # Bucket que o SAM já criou (stack aws-sam-cli-managed-default)
          BUCKET=$(aws cloudformation describe-stacks --stack-name aws-sam-cli-managed-default \
            --query "Stacks[0].Outputs[?OutputKey=='SourceBucket'].OutputValue" --output text)
          KEY="avaliacao-api/${GITHUB_SHA}.zip"     # chave nova a cada commit = redeploy da API
          aws s3 cp avaliacao-api-bundle.zip "s3://$BUCKET/$KEY"
          # Plataforma Corretto 21 / Amazon Linux 2023 mais recente (a lista vem da mais nova para a mais antiga)
          STACK=$(aws elasticbeanstalk list-available-solution-stacks \
            --query "SolutionStacks[?contains(@, 'Amazon Linux 2023') && contains(@, 'Corretto 21') && !contains(@, 'Tomcat')] | [0]" --output text)
          echo "Bundle: s3://$BUCKET/$KEY | Plataforma: $STACK"
          echo "APP_BUCKET=$BUCKET"  >> "$GITHUB_ENV"
          echo "APP_KEY=$KEY"        >> "$GITHUB_ENV"
          echo "EB_STACK=$STACK"     >> "$GITHUB_ENV"

      # Não usa "sam build": o template já aponta para os function.zip gerados pelo Maven.
      - name: sam deploy
        run: |
          sam deploy \
            --template-file template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "Stage=dev" \
              "AdminEmail=${{ secrets.ADMIN_EMAIL }}" \
              "AppBundleBucket=$APP_BUCKET" \
              "AppBundleKey=$APP_KEY" \
              "SolutionStackName=\"$EB_STACK\""   # aspas escapadas: o nome da plataforma tem espaços

      - name: Smoke test pós-deploy
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          BASE="$API_URL/api/avaliacao/v1"
          echo "API: $BASE"

          # Spring leva alguns segundos para subir: retentativas generosas
          STATUS=$(curl -s --max-time 30 --retry 6 --retry-delay 10 --retry-all-errors -o resp.json -w "%{http_code}" \
            -X POST "$BASE" -H "Content-Type: application/json" \
            -d '{"descricao":"smoke test CI","nota":9}')
          cat resp.json; echo
          test "$STATUS" = "201" || { echo "Esperado 201, recebido $STATUS"; exit 1; }

          STATUS=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" \
            -X POST "$BASE" -H "Content-Type: application/json" \
            -d '{"descricao":"x","nota":42}')
          test "$STATUS" = "400" || { echo "Validação falhou: esperado 400, recebido $STATUS"; exit 1; }
          echo "Smoke test OK"
