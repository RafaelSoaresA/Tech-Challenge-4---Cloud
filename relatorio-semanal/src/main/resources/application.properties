
%prod.quarkus.dynamodb.devservices.enabled=false
%prod.quarkus.dynamodb.aws.region=${AWS_REGION}
%prod.quarkus.dynamodb.aws.credentials.type=default
%prod.quarkus.s3.devservices.enabled=false
%prod.quarkus.s3.aws.region=${AWS_REGION}
%prod.quarkus.s3.aws.credentials.type=default
%prod.quarkus.lambda.handler=weekly-report
# Configuracao dos adaptadores.
%prod.reports.evaluations-table=${EVALUATIONS_TABLE:avaliacoes-dev}
%prod.reports.bucket=${REPORTS_BUCKET}

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] (%t) requestId=%X{requestId} %s%e%n
