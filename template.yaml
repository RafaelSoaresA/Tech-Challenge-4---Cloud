AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Tech Challenge Fase 4 - Plataforma de feedbacks de aulas (API Spring no Elastic Beanstalk + Lambdas Quarkus) (US10/US11)

# ---------------------------------------------------------------------------
# Parâmetros: valores que mudam por ambiente. São passados no deploy
# (samconfig.toml ou --parameter-overrides no GitHub Actions).
# ---------------------------------------------------------------------------
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  AdminEmail:
    Type: String
    Description: E-mail que recebe os alertas críticos (precisa confirmar a assinatura do SNS)
  LimiteNotaCritica:
    Type: Number
    Default: 4
    Description: Nota igual ou abaixo deste valor é considerada crítica (alinhar com Dev 2 / US04)
  # --- API de avaliação (Spring Boot) no Elastic Beanstalk: o pipeline preenche estes 4 ---
  AppBundleBucket:
    Type: String
    Description: Bucket S3 onde o pipeline enviou o pacote (zip) da avaliacao-api
  AppBundleKey:
    Type: String
    Description: Chave (caminho) do zip no bucket. Muda a cada commit, e isso dispara o redeploy da API
  SolutionStackName:
    Type: String
    Description: Plataforma do Beanstalk (Corretto 21 / Amazon Linux 2023). O pipeline descobre a mais recente
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t4g.micro, t4g.small]
    Description: t3.small (2 GB) é o mais seguro para Spring Boot; t3.micro (1 GB) é mais barato mas apertado

# ---------------------------------------------------------------------------
# Globals: configurações herdadas por TODAS as Lambdas.
# Java precisa de mais memória que Python para iniciar rápido (512 MB é um bom
# equilíbrio entre custo e cold start). arm64 é mais barato que x86.
#
# O Quarkus usa SEMPRE o mesmo handler genérico; ele descobre qual classe
# executar pelo QUARKUS_LAMBDA_HANDLER (ou, na Lambda HTTP, pelas rotas JAX-RS).
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: java21
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
    Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
    Environment:
      Variables:
        STAGE: !Ref Stage
        TABELA_AVALIACOES: !Ref TabelaAvaliacoes
        LIMITE_NOTA_CRITICA: !Ref LimiteNotaCritica
        JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"   # menor cold start

Resources:
  # ------------------------------- DynamoDB -------------------------------
  TabelaAvaliacoes:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "avaliacoes-${Stage}"
      BillingMode: PAY_PER_REQUEST          # paga por requisição: centavos no volume do projeto
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_IMAGE           # "evento de avaliação registrada" (US03) consumido pela Lambda de alerta

  # --------------------------------- SNS ----------------------------------
  TopicoAlertas:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "alertas-criticos-${Stage}"

  AssinaturaEmailAdmin:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref TopicoAlertas
      Protocol: email
      Endpoint: !Ref AdminEmail

  # ---------------------------------- S3 ----------------------------------
  BucketRelatorios:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ApagarRelatoriosAntigos
            Status: Enabled
            ExpirationInDays: 90

  # ---------------- Tópico de eventos publicado pela API (US03) ----------------
  # A avaliacao-api publica aqui o evento AVALIACAO_CRIADA (ver SnsAvaliacaoEventPublisher).
  # Hoje o alerta crítico sai pela Lambda do Stream; se a equipe preferir, a Lambda de
  # notificação pode assinar este tópico em vez do Stream (decisão do Dev 2).
  TopicoAvaliacoes:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "avaliacao-eventos-${Stage}"

  # ---------------- API de avaliação (Spring Boot) no Elastic Beanstalk ----------------
  # Os nomes de role/instance profile ficam automáticos (começam por "feedback-aulas-dev-"),
  # que é o padrão liberado na role do GitHub Actions (bootstrap/github-oidc-role.yaml).
  EbInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier   # logs, S3 do Beanstalk
      Policies:
        - PolicyName: acesso-dados-da-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow           # a API grava, lê, lista e apaga avaliações
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                Resource: !GetAtt TabelaAvaliacoes.Arn
              - Effect: Allow           # e publica o evento AVALIACAO_CRIADA
                Action: sns:Publish
                Resource: !Ref TopicoAvaliacoes

  EbInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref EbInstanceRole]

  EbApplication:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: !Sub "feedback-aulas-api-${Stage}"

  EbApplicationVersion:
    Type: AWS::ElasticBeanstalk::ApplicationVersion
    Properties:
      ApplicationName: !Ref EbApplication
      SourceBundle:
        S3Bucket: !Ref AppBundleBucket
        S3Key: !Ref AppBundleKey

  EbEnvironment:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      EnvironmentName: !Sub "feedback-api-${Stage}"
      ApplicationName: !Ref EbApplication
      VersionLabel: !Ref EbApplicationVersion
      SolutionStackName: !Ref SolutionStackName
      OptionSettings:
        - {Namespace: "aws:elasticbeanstalk:environment", OptionName: EnvironmentType, Value: SingleInstance}   # 1 EC2, sem load balancer (mais barato)
        - {Namespace: "aws:autoscaling:launchconfiguration", OptionName: IamInstanceProfile, Value: !Ref EbInstanceProfile}
        - {Namespace: "aws:ec2:instances", OptionName: InstanceTypes, Value: !Ref InstanceType}
        - {Namespace: "aws:elasticbeanstalk:application", OptionName: "Application Healthcheck URL", Value: /actuator/health}
        - {Namespace: "aws:elasticbeanstalk:cloudwatch:logs", OptionName: StreamLogs, Value: "true"}           # logs no CloudWatch (US14)
        - {Namespace: "aws:elasticbeanstalk:cloudwatch:logs", OptionName: RetentionInDays, Value: "7"}
        - {Namespace: "aws:elasticbeanstalk:cloudwatch:logs", OptionName: DeleteOnTerminate, Value: "true"}
        # Variáveis de ambiente lidas pelo Spring (relaxed binding: AWS_SNS_AVALIACAO_TOPIC_ARN = aws.sns.avaliacao-topic-arn)
        - {Namespace: "aws:elasticbeanstalk:application:environment", OptionName: SERVER_PORT, Value: "5000"}   # porta que o nginx do Beanstalk espera
        - {Namespace: "aws:elasticbeanstalk:application:environment", OptionName: AWS_REGION, Value: !Ref "AWS::Region"}
        - {Namespace: "aws:elasticbeanstalk:application:environment", OptionName: AWS_SNS_AVALIACAO_TOPIC_ARN, Value: !Ref TopicoAvaliacoes}

  # ---------------- API Gateway (HTTP API) na frente do Beanstalk (US10) ----------------
  # Dá HTTPS e a URL oficial da aplicação; repassa /api/** para a API Spring.
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "feedback-api-${Stage}"
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub "http://${EbEnvironment.EndpointURL}/api/{proxy}"
      PayloadFormatVersion: "1.0"
      TimeoutInMillis: 30000

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /api/{proxy+}"
      Target: !Sub "integrations/${HttpApiIntegration}"

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  # ------------------------- Lambda 2: alerta crítico -------------------------
  NotificarCriticaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "notificar-critica-${Stage}"
      CodeUri: notificar-critica/target/function.zip
      Environment:
        Variables:
          QUARKUS_LAMBDA_HANDLER: notificar-critica      # = @Named("notificar-critica")
          TOPICO_ALERTAS_ARN: !Ref TopicoAlertas
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt TopicoAlertas.TopicName
      Events:
        NovasAvaliacoes:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt TabelaAvaliacoes.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 2
            BisectBatchOnFunctionError: true
            FilterCriteria:                 # só chama a Lambda para inserções (economiza invocações)
              Filters:
                - Pattern: '{"eventName": ["INSERT"]}'

  # ------------------------- Lambda 3: relatório semanal -------------------------
  RelatorioSemanalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "relatorio-semanal-${Stage}"
      CodeUri: relatorio-semanal/target/function.zip
      Timeout: 60
      Environment:
        Variables:
          QUARKUS_LAMBDA_HANDLER: relatorio-semanal      # = @Named("relatorio-semanal")
          BUCKET_RELATORIOS: !Ref BucketRelatorios
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TabelaAvaliacoes
        - S3WritePolicy:
            BucketName: !Ref BucketRelatorios
      Events:
        TodaSegunda:
          Type: ScheduleV2                  # EventBridge Scheduler
          Properties:
            ScheduleExpression: "cron(0 8 ? * MON *)"
            ScheduleExpressionTimezone: America/Sao_Paulo
            Input: "{}"

  # --------------- Logs com retenção curta (evita custo acumulado) ---------------
  LogsNotificar:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NotificarCriticaFunction}"
      RetentionInDays: 7
  LogsRelatorio:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RelatorioSemanalFunction}"
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Description: "URL base da API (use no Postman). Rotas em /api/avaliacao/v1"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  BeanstalkUrl:
    Description: "Endereço direto da API no Beanstalk (diagnóstico; o oficial é o ApiUrl)"
    Value: !Sub "http://${EbEnvironment.EndpointURL}"
  TopicoAvaliacoesArn:
    Value: !Ref TopicoAvaliacoes
  TabelaAvaliacoes:
    Value: !Ref TabelaAvaliacoes
  TopicoAlertasArn:
    Value: !Ref TopicoAlertas
  BucketRelatorios:
    Value: !Ref BucketRelatorios
