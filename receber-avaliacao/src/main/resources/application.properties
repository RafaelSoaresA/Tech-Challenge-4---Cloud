# Cliente DynamoDB leve (sem Apache/Netty), região e credenciais vêm do ambiente da Lambda
quarkus.dynamodb.sync-client.type=url
quarkus.dynamodb.devservices.enabled=false

# Nome da tabela: variável de ambiente TABELA_AVALIACOES (template.yaml). Padrão só para uso local.
tabela.avaliacoes=${TABELA_AVALIACOES:avaliacoes-dev}
